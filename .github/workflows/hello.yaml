name: "Hello"

on:
    workflow_dispatch:

jobs:
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
            - name: Install dependencies
              run: npm ci
            - name: Build action
              run: npm run build
            - uses: ./
