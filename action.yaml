name: "Pull requests Labeling"

description: "Automatically label new pull requests with a specific label."

inputs:
  gh-token:
    description: "GitHub token with permissions to label pull requests."
    required: true
  label:
    description: "The label to apply to new pull requests."
    required: true
    
runs:
  using: "node20"
  main: "dist/index.js"

branding:
  icon: "activity"
  color: "green"
